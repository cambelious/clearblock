<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#22273d"/>
      <stop offset="100%" stop-color="#141724"/>
    </radialGradient>
    <linearGradient id="amber-block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="teal-block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
    <linearGradient id="coral-block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
    <linearGradient id="pink-block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- 2x2 Candy Puzzle Block Cluster -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Top Left: Amber -->
    <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#amber-block)"/>
    <rect x="0" y="0" width="140" height="140" rx="28" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>

    <!-- Top Right: Teal -->
    <rect x="160" y="0" width="140" height="140" rx="28" fill="url(#teal-block)"/>
    <rect x="160" y="0" width="140" height="140" rx="28" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>

    <!-- Bottom Left: Pink -->
    <rect x="0" y="160" width="140" height="140" rx="28" fill="url(#pink-block)"/>
    <rect x="0" y="160" width="140" height="140" rx="28" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>

    <!-- Bottom Right: Coral -->
    <rect x="160" y="160" width="140" height="140" rx="28" fill="url(#coral-block)"/>
    <rect x="160" y="160" width="140" height="140" rx="28" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
  </g>
</svg>
