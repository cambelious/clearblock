<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Blockfall</title>
  <meta name="description" content="Tactile 8x8 block placement puzzle game">
  <meta name="theme-color" content="#1b1e2e">

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- iOS PWA Standalone Mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blockfall">

  <!-- Google Fonts: Bricolage Grotesque & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- Header -->
    <header class="game-header">
      <div class="header-title-group">
        <h1 class="game-title">Blockfall</h1>
        <button id="install-pwa-btn" class="settings-toggle-btn" style="display:none;" title="Install Blockfall App" aria-label="Install App">
          <svg class="toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button id="toggle-sound-btn" class="settings-toggle-btn active" title="Sound: ON (click to mute)" aria-label="Toggle sound">
          <svg class="toggle-icon sound-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="toggle-icon sound-icon-off" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
      <div class="scores-group">
        <div class="score-card">
          <span class="score-label">SCORE</span>
          <span id="current-score" class="score-value">0</span>
        </div>
        <div class="score-card">
          <span class="score-label">BEST</span>
          <span id="best-score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <!-- Settings Bar -->
    <div class="settings-bar">
      <span class="settings-label">Highlight Clears</span>
      <label class="toggle-slider-switch" for="highlight-slider">
        <input type="checkbox" id="highlight-slider" checked aria-label="Highlight line clears on hover">
        <span class="slider-track">
          <span class="slider-thumb"></span>
        </span>
      </label>
    </div>

    <!-- Board Area -->
    <div class="board-wrapper">
      <div id="board" class="board-grid"></div>
      
      <!-- Confetti Canvas -->
      <canvas id="confetti-canvas"></canvas>

      <!-- Game Over Modal Overlay -->
      <div id="game-over-modal" class="game-over-overlay hidden">
        <div class="game-over-content">
          <h2 class="game-over-title">Game Over</h2>
          <span class="game-over-label">Final score</span>
          <span id="final-score" class="game-over-score">0</span>
          <button id="play-again-btn" class="play-again-button">Play Again</button>
        </div>
      </div>
    </div>

    <!-- Piece Tray Area -->
    <div id="tray" class="tray-container">
      <div class="tray-slot" data-slot="0"></div>
      <div class="tray-slot" data-slot="1"></div>
      <div class="tray-slot" data-slot="2"></div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
